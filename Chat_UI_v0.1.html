<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat_UI</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e22;
      --border-color: #2e2e34;
      --text-color: #e1e1e6;
      --text-muted: #8d8d99;
      --primary-color: #007acc;
      --primary-hover: #005999;
      --user-msg-bg: #0284c7;
      --ai-msg-bg: #27272a;
      --think-bg: #18181b;
      --think-border: #3f3f46;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; }
    
    #sidebar { width: 260px; background: var(--card-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 12px; gap: 10px; }
    .sidebar-actions { display: flex; flex-direction: column; gap: 8px; }
    .btn-primary { background: var(--primary-color); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; text-align: center; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #2a2a2e; color: var(--text-color); border: 1px solid var(--border-color); padding: 8px; border-radius: 6px; cursor: pointer; font-size: 12px; text-align: center; }
    .btn-secondary:hover { background: #3a3a3e; }

    .session-title-label { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
    #session-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .session-item { padding: 8px 10px; border-radius: 6px; font-size: 13px; color: var(--text-muted); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent; }
    .session-item:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-color); }
    .session-item.active { background: var(--bg-color); color: var(--text-color); border-color: var(--border-color); font-weight: 500; }

    #chat-container { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    
    .message { display: flex; flex-direction: column; max-width: 85%; gap: 4px; }
    .message.user { align-self: flex-end; }
    .message.assistant { align-self: flex-start; }
    
    .bubble { padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
    .user .bubble { background: var(--user-msg-bg); color: #fff; border-bottom-right-radius: 2px; }
    .assistant .bubble { background: var(--ai-msg-bg); border-bottom-left-radius: 2px; border: 1px solid var(--border-color); }
    .bubble img { max-width: 100%; max-height: 300px; border-radius: 8px; margin-top: 8px; }

    details.think-block { background: var(--think-bg); border: 1px solid var(--think-border); border-radius: 8px; margin-bottom: 10px; padding: 8px 12px; font-size: 12px; color: #a1a1aa; }
    details.think-block summary { cursor: pointer; font-weight: 500; color: #71717a; user-select: none; }
    details.think-block summary:hover { color: var(--text-color); }
    details.think-block .think-content { margin-top: 8px; white-space: pre-wrap; line-height: 1.5; border-top: 1px dashed var(--think-border); padding-top: 8px; }

    #input-area { padding: 15px; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; }
    #attachments-preview { display: flex; gap: 8px; overflow-x: auto; }
    .attachment-item { position: relative; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border-color); background: #000; }
    .attachment-item img { width: 100%; height: 100%; object-fit: cover; }
    .attachment-item .file-flag { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; text-align: center; word-break: break-all; padding: 2px; }
    .attachment-item .remove-btn { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.7); color: #ff4d4f; border: none; border-radius: 50%; width: 16px; height: 16px; cursor: pointer; font-size: 10px; line-height: 16px; }

    .input-box-wrapper { display: flex; gap: 10px; align-items: flex-end; }
    textarea { flex: 1; background: var(--bg-color); border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 8px; resize: none; height: 60px; font-family: inherit; font-size: 14px; }
    textarea:focus { outline: 1px solid var(--primary-color); }

    .btn-action { background: #3a3a3c; color: white; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .btn-action:hover { background: #4a4a4c; }
    .btn-send { background: var(--primary-color); color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
    .btn-send:hover { background: var(--primary-hover); }
    .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }
    .input-options { display: flex; justify-content: flex-end; align-items: center; color: var(--text-muted); font-size: 12px; }
    .thinking-toggle { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
    .thinking-toggle input { width: 15px; height: 15px; accent-color: var(--primary-color); cursor: pointer; }
    .bubble p { margin: 0 0 0.65em; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: 0.8em 0 0.4em; line-height: 1.3; }
    .bubble h1 { font-size: 1.35em; }
    .bubble h2 { font-size: 1.2em; }
    .bubble h3, .bubble h4 { font-size: 1.08em; }
    .bubble ul, .bubble ol { margin: 0.35em 0 0.7em 1.5em; }
    .bubble blockquote { margin: 0.5em 0; padding-left: 10px; border-left: 3px solid var(--primary-color); color: #b8b8c0; }
    .bubble pre { margin: 0.65em 0; padding: 10px 12px; overflow-x: auto; border-radius: 6px; background: #141416; border: 1px solid var(--border-color); }
    .bubble code { padding: 0.12em 0.35em; border-radius: 4px; background: rgba(255,255,255,0.08); font-family: Consolas, "Cascadia Code", monospace; font-size: 0.92em; }
    .bubble pre code { padding: 0; background: transparent; }
    .bubble table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 0.65em 0; }
    .bubble th, .bubble td { border: 1px solid var(--border-color); padding: 5px 9px; text-align: left; }
    .bubble a { color: #55b6f3; text-decoration: underline; }
    .bubble hr { border: 0; border-top: 1px solid var(--border-color); margin: 0.8em 0; }
    .think-content p:last-child { margin-bottom: 0; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="sidebar-actions">
      <button class="btn-primary" onclick="createNewSession()">+ 新建对话</button>
      <button class="btn-secondary" onclick="document.getElementById('cfg-file').click()">读取 config.txt</button>
      <input type="file" id="cfg-file" accept=".txt" style="display:none" onchange="loadConfigFile(event)">

      <button class="btn-secondary" onclick="document.getElementById('hist-file').click()">读取 history.txt</button>
      <input type="file" id="hist-file" accept=".txt" style="display:none" onchange="loadHistoryFile(event)">

      <button class="btn-secondary" onclick="exportHistoryFile()">导出 history.txt</button>
    </div>

    <div class="session-title-label">历史对话记录</div>
    <div id="session-list"></div>
  </div>

  <div id="chat-container">
    <div id="messages"></div>

    <div id="input-area">
      <div class="input-options">
        <label class="thinking-toggle"><input id="thinking-toggle" type="checkbox" checked onchange="setThinkingEnabled(this.checked)"> 启用思考</label>
      </div>
      <div id="attachments-preview"></div>
      <div class="input-box-wrapper">
        <button class="btn-action" onclick="document.getElementById('file-input').click()">📎</button>
        <input type="file" id="file-input" multiple style="display:none" onchange="handleFileSelect(event)">
        <textarea id="user-input" placeholder="输入消息... (Shift+Enter 换行)" onkeydown="handleKeyDown(event)"></textarea>
        <button id="send-btn" class="btn-send" onclick="sendMessage()">发送</button>
      </div>
    </div>
  </div>

  <script>
    let config = {
      baseUrl: '', apiKey: '', model: '', apiFormat: 'auto', fileMode: 'auto', systemPrompt: 'You are a helpful assistant.',
      temperature: 0.7, topP: 1.0, maxTokens: 4096, presencePenalty: 0.0, frequencyPenalty: 0.0,
      topK: null, minP: null, typicalP: null, repetitionPenalty: null,
      enableThinking: true, showCot: true, thinkingBudget: 2048, reasoningEffort: 'medium', maxHistoryBytes: 1048576
    };

    let allHistoryRecords = [];
    let sessionsMap = {};
    let currentSessionId = '';
    let attachments = [];

    window.addEventListener('DOMContentLoaded', () => {
      createNewSession();
    });

    function loadConfigFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        parseConfig(evt.target.result);
        alert('配置读取成功！');
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function parseConfig(text) {
      try {
        const json = JSON.parse(text);
        if (json.baseUrl || json.BASE_URL) config.baseUrl = json.baseUrl || json.BASE_URL;
        if (json.apiKey || json.API_KEY) config.apiKey = json.apiKey || json.API_KEY;
        if (json.model || json.DEFAULT_MODEL || json.MODEL) config.model = json.model || json.DEFAULT_MODEL || json.MODEL;
        if (json.apiFormat || json.API_FORMAT) config.apiFormat = (json.apiFormat || json.API_FORMAT).toLowerCase();
        if (json.fileMode || json.FILE_MODE) config.fileMode = (json.fileMode || json.FILE_MODE).toLowerCase();
        if (json.systemPrompt || json.SYSTEM_PROMPT) config.systemPrompt = json.systemPrompt || json.SYSTEM_PROMPT;
        
        if (json.temperature !== undefined || json.TEMPERATURE !== undefined) config.temperature = parseFloat(json.temperature ?? json.TEMPERATURE);
        if (json.topP !== undefined || json.TOP_P !== undefined) config.topP = parseFloat(json.topP ?? json.TOP_P);
        if (json.maxTokens !== undefined || json.MAX_TOKENS !== undefined) config.maxTokens = parseInt(json.maxTokens ?? json.MAX_TOKENS);
        if (json.presencePenalty !== undefined || json.PRESENCE_PENALTY !== undefined) config.presencePenalty = parseFloat(json.presencePenalty ?? json.PRESENCE_PENALTY);
        if (json.frequencyPenalty !== undefined || json.FREQUENCY_PENALTY !== undefined) config.frequencyPenalty = parseFloat(json.frequencyPenalty ?? json.FREQUENCY_PENALTY);
        if (json.topK !== undefined || json.TOP_K !== undefined) config.topK = parseOptionalNumber(json.topK ?? json.TOP_K, true);
        if (json.minP !== undefined || json.MIN_P !== undefined) config.minP = parseOptionalNumber(json.minP ?? json.MIN_P);
        if (json.typicalP !== undefined || json.TYPICAL_P !== undefined) config.typicalP = parseOptionalNumber(json.typicalP ?? json.TYPICAL_P);
        if (json.repetitionPenalty !== undefined || json.REPETITION_PENALTY !== undefined) config.repetitionPenalty = parseOptionalNumber(json.repetitionPenalty ?? json.REPETITION_PENALTY);
        
        if (json.enableThinking !== undefined || json.ENABLE_THINKING !== undefined) {
          const val = json.enableThinking ?? json.ENABLE_THINKING;
          config.enableThinking = (val === true || val === 'true' || val === 1);
        }
        if (json.showCot !== undefined || json.SHOW_COT !== undefined) {
          const val = json.showCot ?? json.SHOW_COT;
          config.showCot = (val === true || val === 'true' || val === 1);
        }

        if (json.thinkingBudget !== undefined || json.THINKING_BUDGET !== undefined) config.thinkingBudget = parseInt(json.thinkingBudget ?? json.THINKING_BUDGET);
        if (json.reasoningEffort !== undefined || json.REASONING_EFFORT !== undefined) config.reasoningEffort = json.reasoningEffort ?? json.REASONING_EFFORT;
        if (json.maxHistoryBytes !== undefined || json.MAX_HISTORY_BYTES !== undefined) config.maxHistoryBytes = parseInt(json.maxHistoryBytes ?? json.MAX_HISTORY_BYTES);
      } catch {
        text.split('\n').forEach(line => {
          const [key, ...vals] = line.split('=');
          if (!key || vals.length === 0) return;
          const k = key.trim().toUpperCase();
          const v = vals.join('=').trim();
          if (k === 'BASE_URL') config.baseUrl = v;
          if (k === 'API_KEY') config.apiKey = v;
          if (k === 'DEFAULT_MODEL' || k === 'MODEL') config.model = v;
          if (k === 'API_FORMAT') config.apiFormat = v.toLowerCase();
          if (k === 'FILE_MODE') config.fileMode = v.toLowerCase();
          if (k === 'SYSTEM_PROMPT') config.systemPrompt = v;
          if (k === 'TEMPERATURE') config.temperature = parseFloat(v);
          if (k === 'TOP_P') config.topP = parseFloat(v);
          if (k === 'MAX_TOKENS') config.maxTokens = parseInt(v);
          if (k === 'PRESENCE_PENALTY') config.presencePenalty = parseFloat(v);
          if (k === 'FREQUENCY_PENALTY') config.frequencyPenalty = parseFloat(v);
          if (k === 'TOP_K') config.topK = parseOptionalNumber(v, true);
          if (k === 'MIN_P') config.minP = parseOptionalNumber(v);
          if (k === 'TYPICAL_P') config.typicalP = parseOptionalNumber(v);
          if (k === 'REPETITION_PENALTY') config.repetitionPenalty = parseOptionalNumber(v);
          if (k === 'ENABLE_THINKING') config.enableThinking = (v.toLowerCase() === 'true' || v === '1');
          if (k === 'SHOW_COT') config.showCot = (v.toLowerCase() === 'true' || v === '1');
          if (k === 'THINKING_BUDGET') config.thinkingBudget = parseInt(v);
          if (k === 'REASONING_EFFORT') config.reasoningEffort = v;
          if (k === 'MAX_HISTORY_BYTES') config.maxHistoryBytes = parseInt(v);
        });
      }
        syncThinkingToggle();
      }

      function parseOptionalNumber(value, integer = false) {
        if (value === null || String(value).trim() === '') return null;
        const number = integer ? Number.parseInt(value, 10) : Number.parseFloat(value);
        return Number.isFinite(number) ? number : null;
      }

      function hasSamplingValue(value) {
        return value !== null && value !== undefined && Number.isFinite(value);
      }

      function setThinkingEnabled(enabled) {
        config.enableThinking = Boolean(enabled);
      }

      function syncThinkingToggle() {
        const toggle = document.getElementById('thinking-toggle');
        if (toggle) toggle.checked = config.enableThinking;
    }

    function getEffectiveFormat() {
      if (config.apiFormat && config.apiFormat !== 'auto') {
        const format = config.apiFormat.toLowerCase();
        if (['google', 'googleai', 'google-ai'].includes(format)) return 'gemini';
        if (['openai-compatible', 'openai_compatible'].includes(format)) return 'openai';
        return format;
      }
      const url = (config.baseUrl || '').toLowerCase();
      const model = (config.model || '').toLowerCase();
      if (url.includes('anthropic') || model.startsWith('claude')) return 'anthropic';
      if (url.includes('generativelanguage.googleapis.com') || model.startsWith('gemini')) return 'gemini';
      return 'openai';
    }

    // ================= 文件投递的三种路线（config.txt 里用 FILE_MODE 指定） =================
    // inline  : 本地读取。文本类文件内嵌为提示词文本；二进制文件无法发送（直接拒绝）。
    // native  : 文件作为原生文件块随请求发送，各家格式不同（Responses input_file /
    //           chat.completions file 块 / Anthropic document / Gemini inlineData）。
    // extract : 先上传给服务端解析成文本，再把文本放进提示词（Kimi file-extract、智谱文件解析）。
    // auto（默认）: 按端点能力自动选择上面三种之一。
    const FILE_MODES = ['auto', 'native', 'extract', 'inline'];

    // 以下主机名单依据各家官方文档整理（2026-10 核对）
    // Responses API 接受任意类型文件的端点（智谱的 Responses 基址与对话补全不同）
    const RESPONSES_FILE_HOSTS = ['api.openai.com', 'api.x.ai', 'open.bigmodel.cn', 'api.z.ai'];
    // chat/completions 上支持 file 内容块（官方仅 PDF）的端点
    const CHAT_FILE_HOSTS = ['api.openai.com', 'openrouter.ai'];
    // 提供“上传→解析成文本”能力的端点
    const EXTRACT_FILE_HOSTS = ['api.moonshot.cn', 'api.moonshot.ai', 'api.kimi.com', 'open.bigmodel.cn', 'api.z.ai'];

    function getHost() {
      try {
        return new URL(config.baseUrl).hostname.toLowerCase();
      } catch {
        return '';
      }
    }

    function hostMatches(hosts) {
      const host = getHost();
      return hosts.some(h => host === h || host.endsWith('.' + h));
    }

    function isPdfFile(file) {
      return file.mime === 'application/pdf' || /\.pdf$/i.test(file.name || '');
    }

    // 思考开关：DeepSeek 官方文档（Thinking Mode）明确区分两件事 ——
    //   开关：OpenAI 格式用 {"thinking": {"type": "enabled/disabled"}}
    //   强度：{"reasoning_effort": "low/high/max"}
    // 只发 reasoning_effort 是关不掉思考的（DeepSeek 默认就开思考）。
    // Anthropic / Gemini 走各自的 thinking 字段，已在各自函数里显式处理。
    const THINKING_TOGGLE_HOSTS = ['api.deepseek.com'];

    // 把界面上的强度值归一化到官方认可的 low / high / max
    function resolveEffortLevel() {
      const map = { minimal: 'low', low: 'low', medium: 'high', high: 'high', xhigh: 'high', max: 'max', ultra: 'max' };
      return map[String(config.reasoningEffort || 'high').toLowerCase()] || 'high';
    }

    function resolveFileMode(format) {
      const mode = (config.fileMode || 'auto').toLowerCase();
      if (mode !== 'auto' && FILE_MODES.includes(mode)) return mode;
      if (format === 'anthropic' || format === 'gemini') return 'native';
      // 同时具备 Responses 与解析服务的端点，auto 默认走解析（更省事，不依赖 Responses 模型能力）
      if (hostMatches(EXTRACT_FILE_HOSTS)) return 'extract';
      if (resolveOpenAIFileEndpoint() !== 'none') return 'native';
      return 'inline';
    }

    // OpenAI 家族端点发文件走哪套协议
    //   'responses' -> /responses + input_file（任意类型）
    //   'chat-file' -> /chat/completions + file 内容块（官方仅 PDF，如 OpenRouter）
    //   'none'      -> 该端点不接受文件（例如 DeepSeek：官方文档写 File inputs are not supported）
    function resolveOpenAIFileEndpoint() {
      if (hostMatches(RESPONSES_FILE_HOSTS)) return 'responses';
      if (hostMatches(CHAT_FILE_HOSTS)) return 'chat-file';
      return 'none';
    }

    // 仅官方 OpenAI、xAI、智谱提供 Responses API；智谱的基址与对话补全不同
    function resolveResponsesEndpoint() {
      let base = (config.baseUrl || '').replace(/\/+$/, '');
      const zhipu = base.match(/^(https?:\/\/[^/]+)\/api\/paas\/v4$/);
      if (zhipu) return zhipu[1] + '/api/v1/responses';
      if (base.endsWith('/chat/completions')) base = base.slice(0, -'/chat/completions'.length);
      return base.endsWith('/responses') ? base : base + '/responses';
    }

    // 原生文件能力：mimes 为 null 表示不限制类型
    function getNativeFileSupport(format) {
      if (format === 'anthropic' || format === 'gemini') return { mimes: ['application/pdf'] };
      const kind = resolveOpenAIFileEndpoint();
      if (kind === 'responses') return { mimes: null };
      if (kind === 'chat-file') return { mimes: ['application/pdf'] };
      return { mimes: [] };
    }

    function getExtractProfile() {
      const host = getHost();
      let base = (config.baseUrl || '').replace(/\/+$/, '').replace(/\/chat\/completions$/, '');
      if (hostMatches(['api.moonshot.cn', 'api.moonshot.ai', 'api.kimi.com'])) {
        return { label: 'Kimi / Moonshot', base, kind: 'moonshot' };
      }
      if (hostMatches(['open.bigmodel.cn', 'api.z.ai'])) {
        // 解析服务挂在对话补全的 /api/paas/v4 下
        if (base.endsWith('/api/v1')) base = base.slice(0, -'/api/v1'.length);
        if (!base.endsWith('/api/paas/v4')) base += '/api/paas/v4';
        return { label: '智谱 GLM', base, kind: 'zhipu' };
      }
      return null;
    }

    function dataUrlToBlob(file) {
      const [head, payload] = (file.data || '').split(',');
      const mime = (head.match(/data:([^;]+)/) || [])[1] || file.mime || 'application/octet-stream';
      const binary = atob(payload || '');
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new Blob([bytes], { type: mime });
    }

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    async function extractFileText(file, profile) {
      const form = new FormData();
      form.append('file', dataUrlToBlob(file), file.name);
      const auth = { 'Authorization': `Bearer ${config.apiKey}` };

      if (profile.kind === 'moonshot') {
        form.append('purpose', 'file-extract');
        const upload = await fetch(`${profile.base}/files`, { method: 'POST', headers: auth, body: form });
        if (!upload.ok) throw new Error(`上传失败 HTTP ${upload.status}: ${await upload.text()}`);
        const meta = await upload.json();
        if (!meta.id) throw new Error('上传未返回 file id');
        const content = await fetch(`${profile.base}/files/${meta.id}/content`, { headers: auth });
        if (!content.ok) throw new Error(`读取解析正文失败 HTTP ${content.status}`);
        return await content.text();
      }

      if (profile.kind === 'zhipu') {
        form.append('tool_type', 'lite');
        form.append('file_type', (file.name.split('.').pop() || '').toUpperCase());
        const create = await fetch(`${profile.base}/files/parser/create`, { method: 'POST', headers: auth, body: form });
        if (!create.ok) throw new Error(`创建解析任务失败 HTTP ${create.status}: ${await create.text()}`);
        const task = await create.json();
        const taskId = task.task_id || (task.data && task.data.task_id);
        if (!taskId) throw new Error('解析任务未返回 task_id');
        for (let attempt = 0; attempt < 40; attempt++) {
          const res = await fetch(`${profile.base}/files/parser/result/${taskId}/text`, { headers: auth });
          if (!res.ok) throw new Error(`获取解析结果失败 HTTP ${res.status}`);
          const data = await res.json();
          const body = data.data && typeof data.data === 'object' ? data.data : data;
          if (body.status === 'succeeded') return body.content || '';
          if (body.status && !['processing', 'pending', 'running', 'created'].includes(body.status)) {
            throw new Error(body.message || `解析失败: ${body.status}`);
          }
          await sleep(3000);
        }
        throw new Error('解析超时（已等待 2 分钟），请稍后重试');
      }

      throw new Error('未配置解析服务');
    }

    function buildFileRejectionMessage(files, mode, format) {
      const names = files.map(file => file.name).join('、');
      const support = getNativeFileSupport(format);
      let reason;
      if (mode === 'native') {
        reason = support.mimes === null
          ? '当前端点不支持这些文件类型。'
          : support.mimes.length
            ? `当前端点原生支持的文件类型只有：${support.mimes.join('、')}。`
            : `当前端点不接受任何文件输入（${getHost() || '未设置端点'}）。`;
      } else if (mode === 'extract') {
        reason = 'FILE_MODE=extract 需要服务端解析能力，当前端点不在支持列表内。';
      } else {
        reason = 'FILE_MODE=inline 只在本地读取文本类文件，二进制文件（PDF / Office / 压缩包等）无法发送。';
      }
      return `无法发送以下附件：${names}\n\n${reason}\n\n` +
        '在 config.txt 中调整 FILE_MODE 可切换三种路线：\n' +
        '1. inline  —— 本地读取文本类文件并内嵌为文本，二进制文件拒绝；\n' +
        '2. native  —— 文件作为原生文件块直接发送（官方 OpenAI Responses、x.ai、OpenRouter、Anthropic、Gemini）；\n' +
        '3. extract —— 先上传给服务端解析成文本再发送（Kimi / Moonshot、智谱 GLM）。';
    }

    function getRecentMessages() {
      return (sessionsMap[currentSessionId]?.messages || []).slice(-10);
    }

    function getImageBase64(image) {
      return image.data.slice(image.data.indexOf(',') + 1);
    }

    function getPdfBase64(pdf) {
      return pdf.data.slice(pdf.data.indexOf(',') + 1);
    }

    function readFileAs(file, method) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error(`无法读取文件: ${file.name}`));
        reader[method](file);
      });
    }

    function isTextFile(file) {
      return file.type.startsWith('text/') || /\.(txt|md|csv|tsv|json|xml|html|htm|js|mjs|css|py|c|h|cpp|sql|log|yaml|yml)$/i.test(file.name);
    }

    async function readSSEStream(response, onEvent) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let dataLines = [];
      let eventName = '';

      const dispatch = async () => {
        if (dataLines.length) await onEvent(dataLines.join('\n'), eventName);
        dataLines = [];
        eventName = '';
      };

      while (true) {
        const { done, value } = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
        const lines = buffer.split(/\r?\n/);
        buffer = lines.pop() || '';
        for (const line of lines) {
          if (!line) {
            await dispatch();
          } else if (line.startsWith('data:')) {
            dataLines.push(line.slice(5).trimStart());
          } else if (line.startsWith('event:')) {
            eventName = line.slice(6).trim();
          }
        }
        if (done) break;
      }
      if (buffer.startsWith('data:')) dataLines.push(buffer.slice(5).trimStart());
      await dispatch();
    }

    function updateThinkingText(text, thinkEl, state) {
      if (!text) return;
      state.text += text;
      if (config.showCot) {
        thinkEl.style.display = 'block';
        renderRichText(thinkEl.querySelector('.think-content'), state.text);
      }
    }

    function updateAnswerText(text, bubbleEl, state) {
      if (!text) return;
      state.text += text;
      renderRichText(bubbleEl, state.text);
    }

    function normalizeControlCharacters(text) {
      return String(text ?? '')
        .replace(/\u001B\[[0-?]*[ -/]*[@-~]/g, '')
        .replace(/\r\n?/g, '\n')
        .replace(/\t/g, '    ')
        .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F]/g, '');
    }

    function renderRichText(target, text) {
      const source = normalizeControlCharacters(text);
      target.replaceChildren();
      appendMarkdownBlocks(target, source.split('\n'));
    }

    function safeMarkdownUrl(value, isImage = false) {
      try {
        const url = new URL(value.trim(), window.location.href);
        const allowed = isImage ? ['http:', 'https:'] : ['http:', 'https:', 'mailto:'];
        return allowed.includes(url.protocol) ? url.href : '';
      } catch {
        return '';
      }
    }

    function appendInlineText(parent, text) {
      text.split('\n').forEach((line, index) => {
        if (index) parent.appendChild(document.createElement('br'));
        parent.appendChild(document.createTextNode(line));
      });
    }

    function appendMarkdownInline(parent, text, depth = 0) {
      if (depth > 8) {
        appendInlineText(parent, text);
        return;
      }

      const pattern = /!\[[^\]]*\]\([^)]+\)|\[[^\]]+\]\([^)]+\)|`[^`]+`|\*\*[^*]+\*\*|__[^_]+__|~~[^~]+~~|\*[^*]+\*|_[^_]+_/g;
      let cursor = 0;
      let match;
      while ((match = pattern.exec(text)) !== null) {
        appendInlineText(parent, text.slice(cursor, match.index));
        const token = match[0];
        const imageMatch = token.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
        const linkMatch = token.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
        if (imageMatch || linkMatch) {
          const isImage = Boolean(imageMatch);
          const label = (imageMatch || linkMatch)[1];
          const destination = (imageMatch || linkMatch)[2].trim().match(/^(\S+?)(?:\s+"[^"]*")?$/)?.[1];
          const href = destination && safeMarkdownUrl(destination, isImage);
          if (!href) {
            appendInlineText(parent, token);
          } else if (isImage) {
            const image = document.createElement('img');
            image.src = href;
            image.alt = label;
            image.loading = 'lazy';
            image.referrerPolicy = 'no-referrer';
            parent.appendChild(image);
          } else {
            const link = document.createElement('a');
            link.href = href;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            appendMarkdownInline(link, label, depth + 1);
            parent.appendChild(link);
          }
        } else if (token.startsWith('`')) {
          const code = document.createElement('code');
          code.textContent = token.slice(1, -1);
          parent.appendChild(code);
        } else {
          let tag = 'em';
          let content = token.slice(1, -1);
          if (token.startsWith('**') || token.startsWith('__')) {
            tag = 'strong';
            content = token.slice(2, -2);
          } else if (token.startsWith('~~')) {
            tag = 'del';
            content = token.slice(2, -2);
          }
          const element = document.createElement(tag);
          appendMarkdownInline(element, content, depth + 1);
          parent.appendChild(element);
        }
        cursor = pattern.lastIndex;
      }
      appendInlineText(parent, text.slice(cursor));
    }

    function splitMarkdownTableRow(line) {
      const cells = [];
      let cell = '';
      let escaped = false;
      const source = line.trim().replace(/^\|/, '').replace(/\|$/, '');
      for (const char of source) {
        if (char === '|' && !escaped) {
          cells.push(cell.trim().replace(/\\\|/g, '|'));
          cell = '';
        } else {
          cell += char;
        }
        escaped = char === '\\' && !escaped;
        if (char !== '\\') escaped = false;
      }
      cells.push(cell.trim().replace(/\\\|/g, '|'));
      return cells;
    }

    function isMarkdownTable(lines, index) {
      return index + 1 < lines.length && lines[index].includes('|') &&
        /^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[index + 1]);
    }

    function appendMarkdownBlocks(parent, lines) {
      let index = 0;
      while (index < lines.length) {
        const line = lines[index];
        if (!line.trim()) {
          index++;
          continue;
        }

        const fence = line.match(/^\s{0,3}(`{3,}|~{3,})\s*([\w-]*)\s*$/);
        if (fence) {
          const codeLines = [];
          index++;
          while (index < lines.length && !new RegExp(`^\\s{0,3}${fence[1][0]}{${fence[1].length},}\\s*$`).test(lines[index])) {
            codeLines.push(lines[index++]);
          }
          if (index < lines.length) index++;
          const pre = document.createElement('pre');
          const code = document.createElement('code');
          if (fence[2]) code.className = `language-${fence[2]}`;
          code.textContent = codeLines.join('\n');
          pre.appendChild(code);
          parent.appendChild(pre);
          continue;
        }

        const heading = line.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/);
        if (heading) {
          const element = document.createElement(`h${heading[1].length}`);
          appendMarkdownInline(element, heading[2]);
          parent.appendChild(element);
          index++;
          continue;
        }

        if (/^\s{0,3}(?:-{3,}|_{3,}|\*{3,})\s*$/.test(line)) {
          parent.appendChild(document.createElement('hr'));
          index++;
          continue;
        }

        if (isMarkdownTable(lines, index)) {
          const headers = splitMarkdownTableRow(lines[index]);
          index += 2;
          const table = document.createElement('table');
          const thead = document.createElement('thead');
          const headerRow = document.createElement('tr');
          headers.forEach(header => {
            const cell = document.createElement('th');
            appendMarkdownInline(cell, header);
            headerRow.appendChild(cell);
          });
          thead.appendChild(headerRow);
          table.appendChild(thead);
          const tbody = document.createElement('tbody');
          while (index < lines.length && lines[index].includes('|') && lines[index].trim()) {
            const row = document.createElement('tr');
            splitMarkdownTableRow(lines[index++]).forEach(value => {
              const cell = document.createElement('td');
              appendMarkdownInline(cell, value);
              row.appendChild(cell);
            });
            tbody.appendChild(row);
          }
          table.appendChild(tbody);
          parent.appendChild(table);
          continue;
        }

        if (/^\s{0,3}>\s?/.test(line)) {
          const quoteLines = [];
          while (index < lines.length && /^\s{0,3}>\s?/.test(lines[index])) {
            quoteLines.push(lines[index++].replace(/^\s{0,3}>\s?/, ''));
          }
          const quote = document.createElement('blockquote');
          appendMarkdownBlocks(quote, quoteLines);
          parent.appendChild(quote);
          continue;
        }

        const listMatch = line.match(/^\s{0,3}([-+*]|\d+[.)])\s+(.+)$/);
        if (listMatch) {
          const ordered = /^\d/.test(listMatch[1]);
          const list = document.createElement(ordered ? 'ol' : 'ul');
          while (index < lines.length) {
            const itemMatch = lines[index].match(/^\s{0,3}([-+*]|\d+[.)])\s+(.+)$/);
            if (!itemMatch || /^\d/.test(itemMatch[1]) !== ordered) break;
            const item = document.createElement('li');
            appendMarkdownInline(item, itemMatch[2]);
            list.appendChild(item);
            index++;
          }
          parent.appendChild(list);
          continue;
        }

        const paragraphLines = [line];
        index++;
        while (index < lines.length && lines[index].trim() &&
          !/^\s{0,3}(?:#{1,6}\s|>|```|~~~|[-+*]\s|\d+[.)]\s|(?:-{3,}|_{3,}|\*{3,})\s*$)/.test(lines[index]) &&
          !isMarkdownTable(lines, index)) {
          paragraphLines.push(lines[index++]);
        }
        const paragraph = document.createElement('p');
        appendMarkdownInline(paragraph, paragraphLines.join('\n'));
        parent.appendChild(paragraph);
      }
    }

    function appendOpenAIContent(chunk, bubbleEl, thinkEl, state) {
      state.pending += chunk;
      const markerPattern = /<think>|<\/think>/g;
      let cursor = 0;
      let match;
      const appendText = text => {
        if (state.inThinking) updateThinkingText(text, thinkEl, state.thinking);
        else updateAnswerText(text, bubbleEl, state.answer);
      };

      while ((match = markerPattern.exec(state.pending)) !== null) {
        appendText(state.pending.slice(cursor, match.index));
        state.inThinking = match[0] === '<think>';
        if (!state.inThinking) thinkEl.querySelector('summary').innerText = '思考过程 (已完成)';
        cursor = markerPattern.lastIndex;
      }

      const trailing = state.pending.slice(cursor);
      let heldLength = 0;
      ['<think>', '</think>'].forEach(marker => {
        const maxLength = Math.min(marker.length - 1, trailing.length);
        for (let length = maxLength; length > heldLength; length--) {
          if (trailing.endsWith(marker.slice(0, length))) heldLength = length;
        }
      });
      appendText(trailing.slice(0, trailing.length - heldLength));
      state.pending = trailing.slice(trailing.length - heldLength);
    }

    function flushOpenAIContent(bubbleEl, thinkEl, state) {
      if (!state.pending) return;
      if (state.inThinking) updateThinkingText(state.pending, thinkEl, state.thinking);
      else updateAnswerText(state.pending, bubbleEl, state.answer);
      state.pending = '';
    }

    function saveAssistantResponse(thinkText, answerText) {
      const content = (thinkText && config.showCot) ? `<think>${thinkText}</think>\n${answerText}` : answerText;
      recordMessage('assistant', content);
    }

    function loadHistoryFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        parseAndApplyHistory(evt.target.result);
        alert('历史记录成功载入！');
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function parseAndApplyHistory(text) {
      allHistoryRecords = [];
      sessionsMap = {};

      text.split('\n').forEach(line => {
        line = line.trim();
        if (!line) return;
        try {
          const item = JSON.parse(line);
          allHistoryRecords.push(item);
          const sId = item.sessionId || 'default_session';
          if (!sessionsMap[sId]) {
            sessionsMap[sId] = {
              title: item.sessionTitle || item.content.slice(0, 15) || '新对话',
              messages: []
            };
          }
          sessionsMap[sId].messages.push(item);
        } catch {}
      });

      renderSidebarSessions();
      const sessionKeys = Object.keys(sessionsMap);
      if (sessionKeys.length > 0) {
        switchSession(sessionKeys[sessionKeys.length - 1]);
      } else {
        createNewSession();
      }
    }

    function exportHistoryFile() {
      if (allHistoryRecords.length === 0) {
        alert('当前没有可导出的历史记录！');
        return;
      }

      let jsonlText = allHistoryRecords.map(r => JSON.stringify(r)).join('\n') + '\n';
      let blob = new Blob([jsonlText], { type: 'text/plain;charset=utf-8' });

      const limit = config.maxHistoryBytes || 1048576;
      while (blob.size > limit && allHistoryRecords.length > 1) {
        allHistoryRecords.shift();
        jsonlText = allHistoryRecords.map(r => JSON.stringify(r)).join('\n') + '\n';
        blob = new Blob([jsonlText], { type: 'text/plain;charset=utf-8' });
      }

      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const now = new Date();
      const timestamp = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, '0'),
        String(now.getDate()).padStart(2, '0'),
        String(now.getHours()).padStart(2, '0'),
        String(now.getMinutes()).padStart(2, '0'),
        String(now.getSeconds()).padStart(2, '0')
      ].join('');
      a.download = `history_${timestamp}.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function renderSidebarSessions() {
      const listEl = document.getElementById('session-list');
      listEl.innerHTML = '';
      const sessionKeys = Object.keys(sessionsMap).reverse();

      sessionKeys.forEach(sId => {
        const div = document.createElement('div');
        div.className = `session-item ${sId === currentSessionId ? 'active' : ''}`;
        div.innerText = sessionsMap[sId].title;
        div.onclick = () => switchSession(sId);
        listEl.appendChild(div);
      });
    }

    function createNewSession() {
      currentSessionId = 'session_' + Date.now();
      sessionsMap[currentSessionId] = {
        title: '新对话',
        messages: []
      };
      renderSidebarSessions();
      renderCurrentMessages();
    }

    function switchSession(sId) {
      currentSessionId = sId;
      renderSidebarSessions();
      renderCurrentMessages();
    }

    function renderCurrentMessages() {
      const msgsContainer = document.getElementById('messages');
      msgsContainer.innerHTML = '';
      const msgs = sessionsMap[currentSessionId]?.messages || [];
      msgs.forEach(m => {
        renderMessageToUI(m.role, m.content, m.images);
      });
    }

    function recordMessage(role, content) {
      if (sessionsMap[currentSessionId].messages.length === 0 && role === 'user') {
        sessionsMap[currentSessionId].title = content.slice(0, 15) || '新对话';
      }

      const record = {
        sessionId: currentSessionId,
        sessionTitle: sessionsMap[currentSessionId].title,
        time: new Date().toLocaleString(),
        role: role,
        content: content
      };

      sessionsMap[currentSessionId].messages.push(record);
      allHistoryRecords.push(record);

      renderSidebarSessions();
    }

    async function handleFileSelect(e) {
      const files = Array.from(e.target.files);
      e.target.value = '';
      try {
        const loadedFiles = await Promise.all(files.map(async file => {
          if (file.type.startsWith('image/')) {
            return { type: 'image', data: await readFileAs(file, 'readAsDataURL'), mime: file.type, name: file.name };
          }

          const data = await readFileAs(file, 'readAsDataURL');
          const attachment = { type: 'file', data, mime: file.type || 'application/octet-stream', name: file.name };
          if (isTextFile(file)) {
            attachment.textContent = await readFileAs(file, 'readAsText');
          }
          return attachment;
        }));
        attachments.push(...loadedFiles);
        renderAttachments();
      } catch (error) {
        alert(`读取附件失败: ${error.message}`);
      }
    }

    function renderAttachments() {
      const preview = document.getElementById('attachments-preview');
      preview.innerHTML = '';
      attachments.forEach((att, idx) => {
        const div = document.createElement('div');
        div.className = 'attachment-item';
        if (att.type === 'image') {
          div.innerHTML = `<img src="${att.data}"><button class="remove-btn" onclick="removeAttachment(${idx})">✕</button>`;
        } else {
          div.innerHTML = `<div class="file-flag">📄 ${att.name}</div><button class="remove-btn" onclick="removeAttachment(${idx})">✕</button>`;
        }
        preview.appendChild(div);
      });
    }

    function removeAttachment(idx) {
      attachments.splice(idx, 1);
      renderAttachments();
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const text = inputEl.value.trim();
      if (!text && attachments.length === 0) return;

      if (!config.baseUrl || !config.apiKey || !config.model) {
        alert('配置未设置！请先使用左侧“读取 config.txt”选择您的配置文件。');
        return;
      }

      const format = getEffectiveFormat();
      const fileAttachments = attachments.filter(a => a.type === 'file');
      const images = attachments.filter(a => a.type === 'image');

      const mode = resolveFileMode(format);
      const support = getNativeFileSupport(format);

      const nativeFiles = [];
      const inlineFiles = [];
      const toExtract = [];
      const rejectedFiles = [];

      fileAttachments.forEach(file => {
        if (mode === 'native') {
          if (support.mimes === null || support.mimes.includes(file.mime)) nativeFiles.push(file);
          else if (file.textContent !== undefined) inlineFiles.push(file);
          else rejectedFiles.push(file);
        } else if (mode === 'extract') {
          if (file.textContent !== undefined) inlineFiles.push(file);
          else toExtract.push(file);
        } else {
          if (file.textContent !== undefined) inlineFiles.push(file);
          else rejectedFiles.push(file);
        }
      });

      if (rejectedFiles.length) {
        alert(buildFileRejectionMessage(rejectedFiles, mode, format));
        return;
      }

      const profile = toExtract.length ? getExtractProfile() : null;
      if (toExtract.length && !profile) {
        alert(buildFileRejectionMessage(toExtract, mode, format));
        return;
      }

      if (toExtract.length) {
        try {
          for (const file of toExtract) {
            file.resolvedText = await extractFileText(file, profile);
          }
        } catch (error) {
          alert(`使用 ${profile.label} 解析文件失败：${error.message}`);
          return;
        }
      }

      let fullText = text;
      const annotationFiles = [...nativeFiles, ...inlineFiles, ...toExtract];
      if (annotationFiles.length) {
        const fileDetails = annotationFiles.map(file => {
          const body = file.resolvedText !== undefined ? file.resolvedText : file.textContent;
          return `--- ${file.name} ---${body ? '\n' + body : ''}`;
        }).join('\n\n');
        fullText += '\n\n【附带文件】:\n' + fileDetails;
      }

      renderMessageToUI('user', fullText, images.map(i => i.data));
      recordMessage('user', fullText);

      inputEl.value = '';
      attachments = [];
      renderAttachments();

      document.getElementById('send-btn').disabled = true;

      const { bubbleEl, thinkEl } = createAssistantBubbleUI();

      try {
        if (format === 'anthropic') {
          await fetchAnthropicStream(fullText, images, nativeFiles, bubbleEl, thinkEl);
        } else if (format === 'gemini') {
          await fetchGeminiStream(fullText, images, nativeFiles, bubbleEl, thinkEl);
        } else if (nativeFiles.length && resolveOpenAIFileEndpoint() === 'responses') {
          await fetchOpenAIResponsesStream(fullText, images, nativeFiles, bubbleEl, thinkEl);
        } else {
          await fetchOpenAIStream(fullText, images, nativeFiles, bubbleEl, thinkEl);
        }
      } catch (err) {
        bubbleEl.innerText += '\n[发送请求出现异常]: ' + err.message;
      } finally {
        document.getElementById('send-btn').disabled = false;
      }
    }

    function renderMessageToUI(role, text, images = []) {
      const msgsContainer = document.getElementById('messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      if (role === 'assistant') {
        const thinkMatch = text.match(/<think>([\s\S]*?)<\/think>/i);
        if (thinkMatch) {
          if (config.showCot) {
            const details = document.createElement('details');
            details.className = 'think-block';
            const summary = document.createElement('summary');
            summary.innerText = '思考过程';
            const thinkContent = document.createElement('div');
            thinkContent.className = 'think-content';
            renderRichText(thinkContent, thinkMatch[1]);
            details.append(summary, thinkContent);
            bubble.appendChild(details);
          }
          const answer = document.createElement('span');
          renderRichText(answer, text.replace(thinkMatch[0], '').trim());
          bubble.appendChild(answer);
        } else {
          renderRichText(bubble, text);
        }
      } else {
        renderRichText(bubble, text);
      }

      if (images && images.length > 0) {
        images.forEach(imgData => {
          const img = document.createElement('img');
          img.src = imgData;
          bubble.appendChild(img);
        });
      }

      msgDiv.appendChild(bubble);
      msgsContainer.appendChild(msgDiv);
      msgsContainer.scrollTop = msgsContainer.scrollHeight;
      return bubble;
    }

    function createAssistantBubbleUI() {
      const msgsContainer = document.getElementById('messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message assistant';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      const thinkDetails = document.createElement('details');
      thinkDetails.className = 'think-block';
      thinkDetails.style.display = 'none';
      thinkDetails.innerHTML = `<summary>思考过程中...</summary><div class="think-content"></div>`;

      const contentSpan = document.createElement('span');

      bubble.appendChild(thinkDetails);
      bubble.appendChild(contentSpan);
      msgDiv.appendChild(bubble);
      msgsContainer.appendChild(msgDiv);
      msgsContainer.scrollTop = msgsContainer.scrollHeight;

      return { bubbleEl: contentSpan, thinkEl: thinkDetails };
    }

    async function fetchOpenAIResponsesStream(currentText, images, fileAttachments, bubbleEl, thinkEl) {
      const currentMsgs = getRecentMessages();
      const input = currentMsgs.map((record, index) => {
        let content = [{ type: 'input_text', text: record.content }];
        if (index === currentMsgs.length - 1 && record.role === 'user') {
          content = [];
          fileAttachments.forEach(file => content.push({
            type: 'input_file',
            filename: file.name,
            file_data: file.data
          }));
          images.forEach(image => content.push({ type: 'input_image', image_url: image.data }));
          if (currentText) content.push({ type: 'input_text', text: currentText });
        }
        return { role: record.role, content };
      });

      let endpoint = resolveResponsesEndpoint();

      const payload = {
        model: config.model,
        input,
        stream: true,
        max_output_tokens: config.maxTokens
      };
      if (config.systemPrompt) payload.instructions = config.systemPrompt;
      if (hostMatches(THINKING_TOGGLE_HOSTS)) {
        // Responses 格式下 effort=none 才是关闭思考；省略 reasoning 则默认开启
        payload.reasoning = { effort: config.enableThinking ? resolveEffortLevel() : 'none' };
      } else if (config.enableThinking) {
        payload.reasoning = { effort: config.reasoningEffort || 'medium' };
      } else if (!/^(o1|o3|o4|gpt-5)/i.test(config.model)) {
        payload.temperature = config.temperature;
      }

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.apiKey}` },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);

      const thinking = { text: '' };
      const answer = { text: '' };
      const contentState = { pending: '', inThinking: false, thinking, answer };
      await readSSEStream(res, data => {
        const json = JSON.parse(data);
        if (json.type === 'response.failed') throw new Error(json.response?.error?.message || 'OpenAI response failed');
        if (json.type === 'response.reasoning_text.delta' || json.type === 'response.reasoning_summary_text.delta') {
          updateThinkingText(json.delta, thinkEl, thinking);
        } else if (json.type === 'response.output_text.delta') {
          appendOpenAIContent(json.delta, bubbleEl, thinkEl, contentState);
        }
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
      });
      flushOpenAIContent(bubbleEl, thinkEl, contentState);
      saveAssistantResponse(thinking.text, answer.text);
    }

    async function fetchOpenAIStream(currentText, images, chatFiles, bubbleEl, thinkEl) {
      if (chatFiles.length && resolveOpenAIFileEndpoint() === 'responses') {
        await fetchOpenAIResponsesStream(currentText, images, chatFiles, bubbleEl, thinkEl);
        return;
      }

      const apiMessages = [];
      if (config.systemPrompt) apiMessages.push({ role: 'system', content: config.systemPrompt });

      const currentMsgs = getRecentMessages();
      currentMsgs.forEach((record, index) => {
        let content = record.content;
        if (index === currentMsgs.length - 1 && record.role === 'user' && (images.length || chatFiles.length)) {
          content = [];
          chatFiles.forEach(file => content.push({
            type: 'file',
            file: { filename: file.name, file_data: file.data }
          }));
          images.forEach(image => content.push({ type: 'image_url', image_url: { url: image.data } }));
          if (currentText) content.push({ type: 'text', text: currentText });
        }
        apiMessages.push({ role: record.role, content });
      });

      let endpoint = config.baseUrl.replace(/\/+$/, '');
      if (!endpoint.endsWith('/chat/completions')) endpoint += '/chat/completions';

      const payload = {
        model: config.model,
        messages: apiMessages,
        stream: true
      };

      const isReasoningModel = /^(o1|o3|o4|gpt-5)/i.test(config.model);
      const isQwenThinkingModel = /^qwen3/i.test(config.model);
      if (isReasoningModel) {
        payload.max_completion_tokens = config.maxTokens;
      } else {
        payload.max_tokens = config.maxTokens;
        payload.temperature = config.temperature;
        payload.top_p = config.topP;
        payload.presence_penalty = config.presencePenalty;
        payload.frequency_penalty = config.frequencyPenalty;
      }
      payload.reasoning_effort = config.enableThinking ? (config.reasoningEffort || 'medium') : 'none';
      if (hostMatches(THINKING_TOGGLE_HOSTS)) {
        // 显式开关：否则 DeepSeek 默认一直思考，关不掉
        payload.thinking = { type: config.enableThinking ? 'enabled' : 'disabled' };
        if (config.enableThinking) payload.reasoning_effort = resolveEffortLevel();
        else delete payload.reasoning_effort;
      }
      if (hasSamplingValue(config.topK)) payload.top_k = config.topK;
      if (hasSamplingValue(config.minP)) payload.min_p = config.minP;
      if (hasSamplingValue(config.typicalP)) payload.typical_p = config.typicalP;
      if (hasSamplingValue(config.repetitionPenalty)) payload.repetition_penalty = config.repetitionPenalty;
      if (isQwenThinkingModel) payload.enable_thinking = config.enableThinking;

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.apiKey}` },
        body: JSON.stringify(payload)
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);

      const thinking = { text: '' };
      const answer = { text: '' };
      const contentState = { pending: '', inThinking: false, thinking, answer };

      await readSSEStream(res, data => {
        if (data === '[DONE]') return;
        const json = JSON.parse(data);
        if (json.error) throw new Error(json.error.message || 'API stream error');
        const delta = json.choices?.[0]?.delta || {};
        updateThinkingText(delta.reasoning_content || delta.reasoning, thinkEl, thinking);

        let text = delta.content;
        if (Array.isArray(text)) text = text.map(part => part.text || '').join('');
        if (typeof text === 'string') appendOpenAIContent(text, bubbleEl, thinkEl, contentState);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
      });
      flushOpenAIContent(bubbleEl, thinkEl, contentState);
      saveAssistantResponse(thinking.text, answer.text);
    }

    async function fetchAnthropicStream(currentText, images, pdfFiles, bubbleEl, thinkEl) {
      const apiMessages = [];
      const currentMsgs = getRecentMessages();
      currentMsgs.forEach((record, index) => {
        let content = record.content;
        if (index === currentMsgs.length - 1 && record.role === 'user' && (images.length || pdfFiles.length)) {
          content = [];
          pdfFiles.forEach(pdf => content.push({
            type: 'document',
            source: { type: 'base64', media_type: 'application/pdf', data: getPdfBase64(pdf) }
          }));
          images.forEach(image => content.push({
            type: 'image',
            source: { type: 'base64', media_type: image.mime, data: getImageBase64(image) }
          }));
          if (currentText) content.push({ type: 'text', text: currentText });
        }
        apiMessages.push({ role: record.role === 'assistant' ? 'assistant' : 'user', content });
      });

      let endpoint = config.baseUrl.replace(/\/+$/, '');
      if (!endpoint.endsWith('/v1/messages')) {
        endpoint += endpoint.endsWith('/v1') ? '/messages' : '/v1/messages';
      }

      const thinkingBudget = Math.max(1024, config.thinkingBudget || 2048);
      const payload = {
        model: config.model,
        messages: apiMessages,
        max_tokens: config.enableThinking ? Math.max(config.maxTokens || 4096, thinkingBudget + 1) : (config.maxTokens || 4096),
        stream: true
      };
      if (config.systemPrompt) payload.system = config.systemPrompt;

      if (config.enableThinking) {
        payload.thinking = { type: 'enabled', budget_tokens: thinkingBudget };
      } else {
        payload.thinking = { type: 'disabled' };
        payload.temperature = Math.min(Math.max(config.temperature, 0), 1);
      }
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': config.apiKey,
          'anthropic-version': '2023-06-01',
          'dangerously-allow-browser': 'true'
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);

      const thinking = { text: '' };
      const answer = { text: '' };
      await readSSEStream(res, data => {
        const json = JSON.parse(data);
        if (json.type === 'error') throw new Error(json.error?.message || 'Anthropic stream error');
        if (json.type === 'content_block_delta') {
          if (json.delta?.type === 'thinking_delta') updateThinkingText(json.delta.thinking, thinkEl, thinking);
          else if (json.delta?.type === 'text_delta') updateAnswerText(json.delta.text, bubbleEl, answer);
        }
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
      });
      saveAssistantResponse(thinking.text, answer.text);
    }

    async function fetchGeminiStream(currentText, images, pdfFiles, bubbleEl, thinkEl) {
      let endpoint = config.baseUrl.replace(/\/+$/, '');
      if (/:generateContent(?:\?|$)/.test(endpoint)) {
        endpoint = endpoint.replace(':generateContent', ':streamGenerateContent');
      } else if (!/:streamGenerateContent(?:\?|$)/.test(endpoint)) {
        if (!/\/models\/[^/]+$/.test(endpoint)) {
          endpoint += `/models/${encodeURIComponent(config.model)}`;
        }
        endpoint += ':streamGenerateContent';
      }
      endpoint += endpoint.includes('?') ? '&alt=sse' : '?alt=sse';

      const contents = getRecentMessages().map((record, index, records) => {
        const isCurrentWithAttachments = index === records.length - 1 && record.role === 'user' && (images.length || pdfFiles.length);
        const parts = isCurrentWithAttachments ? [] : [{ text: record.content }];
        if (isCurrentWithAttachments) {
          pdfFiles.forEach(pdf => parts.push({
            inlineData: { mimeType: 'application/pdf', data: getPdfBase64(pdf) }
          }));
          images.forEach(image => parts.push({
            inlineData: { mimeType: image.mime, data: getImageBase64(image) }
          }));
          if (currentText) parts.push({ text: currentText });
        }
        return { role: record.role === 'assistant' ? 'model' : 'user', parts };
      });

      const generationConfig = {
        temperature: config.temperature,
        topP: config.topP,
        maxOutputTokens: config.maxTokens,
        presencePenalty: config.presencePenalty,
        frequencyPenalty: config.frequencyPenalty
      };
      if (hasSamplingValue(config.topK)) generationConfig.topK = config.topK;
      if (/^gemini-3/i.test(config.model)) {
        generationConfig.thinkingConfig = {
          thinkingLevel: config.enableThinking ? (config.reasoningEffort || 'medium').toUpperCase() : 'MINIMAL',
          includeThoughts: config.enableThinking
        };
      } else {
        generationConfig.thinkingConfig = {
          thinkingBudget: config.enableThinking ? config.thinkingBudget : 0,
          includeThoughts: config.enableThinking
        };
      }

      const payload = { contents, generationConfig };
      if (config.systemPrompt) payload.systemInstruction = { parts: [{ text: config.systemPrompt }] };
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': config.apiKey },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);

      const thinking = { text: '' };
      const answer = { text: '' };
      await readSSEStream(res, data => {
        const json = JSON.parse(data);
        if (json.error) throw new Error(json.error.message || 'Gemini stream error');
        (json.candidates || []).forEach(candidate => {
          (candidate.content?.parts || []).forEach(part => {
            if (part.thought) updateThinkingText(part.text, thinkEl, thinking);
            else updateAnswerText(part.text, bubbleEl, answer);
          });
        });
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
      });
      saveAssistantResponse(thinking.text, answer.text);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
